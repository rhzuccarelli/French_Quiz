<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Quiz FR">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>participes passés — quiz</title>
<script>(function(){var t=localStorage.getItem('theme');if(t)document.documentElement.setAttribute('data-theme',t);})();</script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:        #f5f5f0;
  --surface:   #ffffff;
  --rule:      #000000;
  --rule-lt:   #d0d0c8;
  --text:      #000000;
  --muted:     #666666;
  --faint:     #aaaaaa;
  --ok-bg:     #e8f5e8;
  --err-bg:    #fce8e8;
  --etre-dot:  #0369A1;
  --avoir-dot: #9D174D;
  --mono:      'Courier New', 'Lucida Console', monospace;
}

:root[data-theme="dark"] {
  --bg:      #1a1a18;
  --surface: #242420;
  --rule:    #d0d0c8;
  --rule-lt: #3a3a36;
  --text:    #e0e0d8;
  --muted:   #888880;
  --faint:   #555550;
  --ok-bg:   #1a2e1a;
  --err-bg:  #2e1a1a;
}

html, body {
  font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
  font-size: 13px;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 40px 20px 80px;
}

/* ── HEADER ── */
.te-header {
  width: 100%;
  max-width: 640px;
  border-top: 2px solid var(--rule);
  border-bottom: 1px solid var(--rule);
  padding: 10px 0;
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 12px;
  margin-bottom: 32px;
}

.te-title {
  font-size: 11px;
  font-weight: 400;
  letter-spacing: 0.12em;
  text-transform: lowercase;
}

.te-subtitle {
  font-size: 10px;
  color: var(--muted);
  letter-spacing: 0.08em;
  font-family: var(--mono);
}

.te-back {
  font-size: 10px;
  color: var(--muted);
  letter-spacing: 0.08em;
  font-family: var(--mono);
  text-decoration: none;
  white-space: nowrap;
}
.te-back:hover { color: var(--text); }

/* ── FILTERS ── */
.te-filters {
  width: 100%;
  max-width: 640px;
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  margin-bottom: 24px;
}

.te-tag {
  font-size: 9px;
  letter-spacing: 0.12em;
  text-transform: lowercase;
  padding: 3px 8px;
  border: 1px solid var(--rule-lt);
  background: var(--surface);
  color: var(--muted);
  cursor: pointer;
  transition: all 0.1s;
  white-space: nowrap;
}
.te-tag:hover  { border-color: var(--rule); color: var(--text); }
.te-tag.active { border-color: var(--rule); background: var(--rule); color: var(--bg); }

/* ── SCOREBAR ── */
.te-scorebar {
  width: 100%;
  max-width: 640px;
  display: grid;
  grid-template-columns: 56px 1fr auto auto;
  align-items: center;
  gap: 12px;
  margin-bottom: 28px;
}

.te-score-num { font-family: var(--mono); font-size: 11px; white-space: nowrap; }
.te-bar-track { height: 1px; background: var(--rule-lt); position: relative; }
.te-bar-fill  { position: absolute; left:0; top:0; height:1px; background: var(--rule); transition: width 0.35s; width:0%; }
.te-q-num     { font-family: var(--mono); font-size: 10px; color: var(--muted); text-align: right; white-space: nowrap; }

.te-streak {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--faint);
  text-align: right;
  white-space: nowrap;
  transition: color 0.2s, font-weight 0.2s;
  min-width: 28px;
}
.te-streak.s5  { color: var(--muted); }
.te-streak.s10 { color: var(--text); font-weight: 700; }
.te-streak.s20 { color: var(--text); font-weight: 700; letter-spacing: 0.06em; }

/* ── CARD ── */
.te-card {
  width: 100%;
  max-width: 640px;
  background: var(--surface);
  border: 1px solid var(--rule);
}

.te-card-head {
  border-bottom: 1px solid var(--rule-lt);
  padding: 8px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.te-group-tag { font-size: 9px; letter-spacing: 0.14em; text-transform: lowercase; color: var(--muted); }
.te-group-dot { width:6px; height:6px; border-radius:50%; background: var(--dot-color,#ccc); display:inline-block; margin-right:6px; vertical-align:middle; }

.te-card-body { padding: 28px 20px 0; }

.te-prompt-verb {
  font-size: 42px;
  font-weight: 700;
  letter-spacing: -0.01em;
  line-height: 1;
  margin-bottom: 4px;
}

.te-prompt-meta {
  display: flex;
  gap: 16px;
  align-items: baseline;
  margin-bottom: 16px;
}

.te-prompt-en { font-size: 11px; color: var(--faint); font-family: var(--mono); margin-left: auto; }

.te-step-label {
  font-size: 9px;
  letter-spacing: 0.14em;
  text-transform: lowercase;
  color: var(--muted);
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.te-step-num {
  font-family: var(--mono);
  font-size: 9px;
  border: 1px solid var(--rule-lt);
  width: 16px; height: 16px;
  display: inline-flex;
  align-items: center; justify-content: center;
  color: var(--muted);
}

.te-input-row {
  display: flex;
  gap: 0;
  border: 1px solid var(--rule);
  margin-bottom: 8px;
}

.te-input {
  flex: 1;
  font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
  font-size: 22px;
  border: none;
  outline: none;
  padding: 10px 12px;
  background: transparent;
  color: var(--text);
  min-width: 0;
}
.te-input::placeholder { color: var(--faint); font-size: 14px; }
.te-input.ok  { background: var(--ok-bg); }
.te-input.err { background: var(--err-bg); }

.te-verify-btn {
  font-size: 9px;
  letter-spacing: 0.14em;
  text-transform: lowercase;
  padding: 0 16px;
  border: none;
  border-left: 1px solid var(--rule);
  background: var(--rule);
  color: var(--bg);
  cursor: pointer;
  white-space: nowrap;
  transition: opacity 0.1s;
}
.te-verify-btn:hover    { opacity: 0.8; }
.te-verify-btn:disabled { background: var(--rule-lt); cursor: default; }

.te-chars { display:flex; flex-wrap:wrap; gap:3px; margin-bottom:12px; }
.te-char {
  font-family: var(--mono); font-size:12px;
  width:24px; height:24px;
  border:1px solid var(--rule-lt); background:var(--bg);
  color:var(--muted); cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  transition: all 0.1s;
}
.te-char:hover { border-color:var(--rule); color:var(--text); background:var(--surface); }

.te-feedback {
  min-height: 28px;
  display: flex;
  align-items: baseline;
  gap: 10px;
  font-size: 12px;
  margin-bottom: 0;
  padding-bottom: 16px;
}
.fb-ok  { font-weight: 700; }
.fb-err { font-weight: 700; }
.fb-correct-form { font-size:18px; font-weight:700; letter-spacing:-0.01em; }
.fb-ipa  { font-family: var(--mono); font-size:10px; color:var(--muted); }
.fb-note { font-family: var(--mono); font-size:10px; color:var(--faint); }

/* ── STEP 2: AUXILIARY ── */
.te-aux-section {
  display: none;
  border-top: 1px solid var(--rule-lt);
  padding: 16px 20px;
}

.te-aux-row {
  display: flex;
  gap: 8px;
  margin-bottom: 10px;
}

.te-aux-btn {
  font-size: 16px;
  font-weight: 700;
  letter-spacing: 0.02em;
  padding: 8px 28px;
  border: 1px solid var(--rule);
  background: var(--surface);
  color: var(--text);
  cursor: pointer;
  transition: all 0.1s;
}
.te-aux-btn:hover:not(:disabled) { background: var(--bg); }
.te-aux-btn:disabled { cursor: default; }
.te-aux-btn.ok-pick  { background: var(--ok-bg);  border-color: #3a8c3a; }
.te-aux-btn.err-pick { background: var(--err-bg);  border-color: #c03030; }
.te-aux-btn.reveal   { background: var(--ok-bg);  border-color: #3a8c3a; }

.te-aux-feedback {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--muted);
  min-height: 16px;
}

/* ── FOOTER ── */
.te-card-foot {
  border-top: 1px solid var(--rule-lt);
  padding: 8px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.te-next-btn {
  font-size: 9px;
  letter-spacing: 0.14em;
  text-transform: lowercase;
  padding: 5px 14px;
  border: 1px solid var(--rule);
  background: transparent;
  color: var(--text);
  cursor: pointer;
  display: none;
  transition: background 0.1s;
}
.te-next-btn:hover { background: var(--rule); color: var(--bg); }

.te-remaining { font-family: var(--mono); font-size: 10px; color: var(--faint); }

.te-hint-toggle {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 10px;
  color: var(--muted);
  cursor: pointer;
  letter-spacing: 0.06em;
}
.te-hint-toggle input { cursor: pointer; accent-color: var(--rule); }

/* ── RESULTS ── */
.te-results {
  display: none;
  width: 100%;
  max-width: 640px;
  background: var(--surface);
  border: 1px solid var(--rule);
  flex-direction: column;
}

.te-results-head {
  border-bottom: 1px solid var(--rule);
  padding: 10px 20px;
  font-size: 9px;
  letter-spacing: 0.14em;
  color: var(--muted);
}

.te-results-body {
  padding: 32px 20px;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 4px;
}

.te-big-score { font-size:64px; font-weight:700; letter-spacing:-0.03em; line-height:1; }
.te-grade     { font-size:11px; color:var(--muted); letter-spacing:0.08em; font-family:var(--mono); margin-top:2px; }

.te-stats-divider {
  width: 100%;
  height: 1px;
  background: var(--rule-lt);
  margin: 8px 0 4px;
}

.te-restart-btn {
  margin-top: 20px;
  font-size: 9px;
  letter-spacing: 0.14em;
  text-transform: lowercase;
  padding: 7px 18px;
  border: 1px solid var(--rule);
  background: var(--rule);
  color: var(--bg);
  cursor: pointer;
  transition: opacity 0.1s;
}
.te-restart-btn:hover { opacity: 0.75; }

.te-missed { width:100%; border-top:1px solid var(--rule-lt); margin-top:24px; padding-top:16px; }
.te-missed-header { font-size:9px; letter-spacing:0.14em; color:var(--muted); margin-bottom:10px; }

.te-missed-row {
  display: grid;
  grid-template-columns: 120px 70px 80px 60px;
  gap: 8px;
  align-items: baseline;
  padding: 5px 0;
  border-bottom: 1px solid var(--rule-lt);
  font-size: 12px;
}

.mi-inf  { color:var(--muted); font-style:italic; }
.mi-pp   { font-weight:700; font-size:14px; }
.mi-ipa  { font-family:var(--mono); font-size:10px; color:var(--faint); }
.mi-aux  { font-family:var(--mono); font-size:9px; letter-spacing:0.1em; padding:1px 5px; border:1px solid; }
.mi-aux.etre  { color: var(--etre-dot);  border-color: var(--etre-dot); }
.mi-aux.avoir { color: var(--avoir-dot); border-color: var(--avoir-dot); }
</style>
</head>
<body>

<header class="te-header">
  <a class="te-back" href="index.html">← menu</a>
  <span class="te-title">participes passés — quiz</span>
  <span class="te-subtitle">passé composé</span>
  <button class="te-tag" id="theme-btn" onclick="toggleTheme()">dark</button>
</header>

<div class="te-filters" id="filters">
  <button class="te-tag active" id="filter-all" onclick="setFilter('all')">tous</button>
</div>

<div class="te-scorebar">
  <span class="te-score-num" id="score-label">0 / 0</span>
  <div class="te-bar-track"><div class="te-bar-fill" id="score-fill"></div></div>
  <span class="te-q-num" id="q-counter"></span>
  <span class="te-streak" id="streak-label">×0</span>
</div>

<div id="quiz-area">
  <div class="te-card" id="main-card">
    <div class="te-card-head">
      <span><span class="te-group-dot" id="card-dot"></span><span class="te-group-tag" id="card-group"></span></span>
    </div>
    <div class="te-card-body">
      <div class="te-prompt-verb" id="prompt-inf"></div>
      <div class="te-prompt-meta">
        <span class="te-prompt-en" id="prompt-en"></span>
      </div>

      <!-- step 1 -->
      <div class="te-step-label">
        <span class="te-step-num">1</span> participe passé
      </div>
      <div class="te-input-row">
        <input class="te-input" id="answer-input" type="text" placeholder="participe passé…"
               autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
        <button class="te-verify-btn" id="submit-btn" onclick="checkPP()">vérifier</button>
      </div>
      <div class="te-chars" id="char-bar"></div>
      <div class="te-feedback" id="feedback-pp"></div>
    </div>

    <!-- step 2 -->
    <div class="te-aux-section" id="step-aux">
      <div class="te-step-label">
        <span class="te-step-num">2</span> quel auxiliaire ?
      </div>
      <div class="te-aux-row">
        <button class="te-aux-btn" id="btn-etre"  onclick="checkAux('être')">être</button>
        <button class="te-aux-btn" id="btn-avoir" onclick="checkAux('avoir')">avoir</button>
      </div>
      <div class="te-aux-feedback" id="feedback-aux"></div>
    </div>

    <div class="te-card-foot">
      <button class="te-next-btn" id="next-btn" onclick="nextQuestion()">suivant →</button>
      <span class="te-remaining" id="remaining"></span>
      <label class="te-hint-toggle">
        <input type="checkbox" id="hint-check" onchange="toggleHint()"> ipa hints
      </label>
    </div>
  </div>
</div>

<div class="te-results" id="results-screen">
  <div class="te-results-head">résultats</div>
  <div class="te-results-body">
    <div class="te-big-score" id="final-pct"></div>
    <div class="te-grade" id="final-tally"></div>
    <div class="te-grade" id="final-breakdown"></div>
    <div class="te-grade" id="final-grade"></div>
    <div class="te-stats-divider"></div>
    <div class="te-grade" id="stats-session"></div>
    <div class="te-grade" id="stats-cumulative"></div>
    <button class="te-restart-btn" onclick="restart()">recommencer</button>
    <div class="te-missed" id="missed-list"></div>
  </div>
</div>

<script>
// ── constants ────────────────────────────────────────────────
const ROUND_N  = 20;
const LS_ITEMS = 'pq_items';
const LS_CUM   = 'pq_cum';

// ── state ────────────────────────────────────────────────────
let groups = [], pool = [], queue = [], current = null;
let scorePP = 0, scoreAux = 0, total = 0, missed = [];
let ppDone = false, auxDone = false;
let activeFilter = 'all', showHints = false;
let streak = 0, roundNum = 0, questionStart = 0;
let sessionCorrect = 0, sessionTimes = [];

// ── persistence ──────────────────────────────────────────────
let itemStats = JSON.parse(localStorage.getItem(LS_ITEMS) || '{}');
let cumStats  = JSON.parse(localStorage.getItem(LS_CUM)   || '{"total":0,"correct":0,"timeSum":0}');

function saveItems() { localStorage.setItem(LS_ITEMS, JSON.stringify(itemStats)); }
function saveCum()   { localStorage.setItem(LS_CUM,   JSON.stringify(cumStats)); }

function maxAvgTime() {
  let m = 5000;
  for (const s of Object.values(itemStats))
    if (s.n > 0) m = Math.max(m, s.t / s.n);
  return m;
}

function itemWeight(it) {
  const s = itemStats[it.verb.inf];
  if (!s || s.n === 0) return 1.5;
  const acc = s.c / s.n;
  const avg = s.t / s.n;
  return Math.max(0.05, (1 - acc) + avg / maxAvgTime());
}

// ── helpers ──────────────────────────────────────────────────
function norm(s){ return s.trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,''); }
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=0|Math.random()*(i+1);[a[i],a[j]]=[a[j],a[i]];}return a; }

// ── pool / weighted round ────────────────────────────────────
function buildPool(fid) {
  pool = [];
  groups.forEach(g => {
    if (fid !== 'all' && g.id !== fid) return;
    g.verbs.forEach(v => pool.push({group:g, verb:v}));
  });
}

function buildRound() {
  buildPool(activeFilter);
  if (!pool.length) { queue = []; return; }
  const w = pool.map(it => itemWeight(it));
  const wt = w.reduce((a,b) => a+b, 0);
  queue = [];
  for (let i = 0; i < ROUND_N; i++) {
    let r = Math.random() * wt, cum = 0;
    for (let j = 0; j < pool.length; j++) {
      cum += w[j];
      if (r < cum) { queue.push(pool[j]); break; }
    }
    if (queue.length < i+1) queue.push(pool[pool.length-1]);
  }
}

// ── filters ──────────────────────────────────────────────────
function setFilter(id) {
  activeFilter = id;
  document.querySelectorAll('.te-tag').forEach(b => b.classList.remove('active'));
  document.getElementById('filter-'+id).classList.add('active');
  restart();
}

// ── chars ────────────────────────────────────────────────────
function insertChar(ch) {
  const inp = document.getElementById('answer-input');
  if (inp.disabled) return;
  const s = inp.selectionStart, e = inp.selectionEnd;
  inp.value = inp.value.slice(0,s)+ch+inp.value.slice(e);
  inp.selectionStart = inp.selectionEnd = s+1;
  inp.focus();
}

// ── dark mode ────────────────────────────────────────────────
function toggleTheme() {
  const dark = document.documentElement.getAttribute('data-theme') === 'dark';
  const next = dark ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('theme', next);
  document.getElementById('theme-btn').textContent = dark ? 'dark' : 'light';
}

// ── score / streak UI ────────────────────────────────────────
function updateScore() {
  const t2 = total*2, c = scorePP+scoreAux, pct = t2>0 ? (c/t2)*100 : 0;
  document.getElementById('score-label').textContent = c+' / '+t2;
  document.getElementById('score-fill').style.width  = pct+'%';
}

function updateStreak() {
  const el = document.getElementById('streak-label');
  el.textContent = '×'+streak;
  el.className = 'te-streak'+(streak>=20?' s20':streak>=10?' s10':streak>=5?' s5':'');
}

function updateRound() {
  const pos = ROUND_N - queue.length;
  document.getElementById('q-counter').textContent = 'round '+roundNum+' — '+pos+'/'+ROUND_N;
  document.getElementById('remaining').textContent = queue.length+' left';
}

// ── quiz flow ────────────────────────────────────────────────
function restart() {
  roundNum++;
  scorePP = 0; scoreAux = 0; total = 0; missed = [];
  sessionCorrect = 0; sessionTimes = [];
  streak = 0;
  buildRound();
  document.getElementById('quiz-area').style.display      = 'block';
  document.getElementById('results-screen').style.display = 'none';
  updateScore(); updateStreak();
  nextQuestion(true);
}

function nextQuestion(first) {
  if (!queue.length) { showResults(); return; }
  current = queue.pop(); ppDone = false; auxDone = false;
  questionStart = Date.now();
  const inp = document.getElementById('answer-input');
  inp.value = ''; inp.className = 'te-input'; inp.disabled = false;
  document.getElementById('prompt-inf').textContent  = current.verb.inf;
  document.getElementById('prompt-en').textContent   = current.verb.en;
  document.getElementById('card-group').textContent  = current.group.label;
  document.getElementById('card-dot').style.background = current.group.dot;
  document.getElementById('feedback-pp').innerHTML   = showHints ? '<span class="fb-ipa">'+current.verb.ipa+'</span>' : '';
  document.getElementById('feedback-aux').textContent = '';
  document.getElementById('step-aux').style.display  = 'none';
  document.getElementById('next-btn').style.display  = 'none';
  document.getElementById('submit-btn').disabled     = false;
  ['btn-etre','btn-avoir'].forEach(id => {
    const b = document.getElementById(id);
    b.className = 'te-aux-btn'; b.disabled = false;
  });
  updateRound();
  if (!first) inp.focus();
}

function checkPP() {
  if (ppDone || !current) return;
  const inp = document.getElementById('answer-input');
  if (!inp.value.trim()) { inp.focus(); return; }
  const elapsed = Date.now() - questionStart;
  ppDone = true; total++;
  const ok = norm(inp.value) === norm(current.verb.pp);
  inp.disabled = true;
  document.getElementById('submit-btn').disabled = true;

  // item stats (PP timing)
  const k = current.verb.inf;
  if (!itemStats[k]) itemStats[k] = {n:0, c:0, t:0};
  itemStats[k].n++;
  itemStats[k].t += elapsed;
  if (ok) itemStats[k].c++;
  saveItems();

  // cumulative
  cumStats.total++;
  cumStats.timeSum += elapsed;
  if (ok) { cumStats.correct++; sessionCorrect++; }
  saveCum();
  sessionTimes.push(elapsed);

  const note = current.verb.note || '';
  if (ok) {
    scorePP++;
    inp.className = 'te-input ok';
    document.getElementById('feedback-pp').innerHTML =
      '<span class="fb-ok">✓</span> <span class="fb-ipa">'+current.verb.ipa+'</span>'
      +(note?' <span class="fb-note">'+note+'</span>':'');
  } else {
    inp.className = 'te-input err';
    document.getElementById('feedback-pp').innerHTML =
      '<span class="fb-err">✗</span> <span class="fb-correct-form">'+current.verb.pp+'</span> <span class="fb-ipa">'+current.verb.ipa+'</span>'
      +(note?' <span class="fb-note">'+note+'</span>':'');
    missed.push(current);
  }
  updateScore();
  document.getElementById('step-aux').style.display = 'block';
}

function checkAux(choice) {
  if (auxDone || !current) return;
  auxDone = true;
  const correct = current.verb.aux;
  const ok = (choice === correct);
  ['btn-etre','btn-avoir'].forEach(id => document.getElementById(id).disabled = true);
  const choiceId  = choice  === 'être' ? 'btn-etre' : 'btn-avoir';
  const correctId = correct === 'être' ? 'btn-etre' : 'btn-avoir';
  document.getElementById(choiceId).classList.add(ok ? 'ok-pick' : 'err-pick');
  if (!ok) document.getElementById(correctId).classList.add('reveal');

  // cumulative (aux question counts separately)
  cumStats.total++;
  if (ok) { cumStats.correct++; }
  saveCum();

  if (ok) {
    scoreAux++;
    streak++;
    document.getElementById('feedback-aux').textContent = '✓ correct';
  } else {
    streak = 0;
    document.getElementById('feedback-aux').textContent = '✗  auxiliaire correct: '+correct;
  }
  updateScore(); updateStreak();
  document.getElementById('next-btn').style.display = 'block';
}

function toggleHint() {
  showHints = document.getElementById('hint-check').checked;
  if (!ppDone) document.getElementById('feedback-pp').innerHTML =
    showHints && current ? '<span class="fb-ipa">'+current.verb.ipa+'</span>' : '';
}

function showResults() {
  document.getElementById('quiz-area').style.display       = 'none';
  document.getElementById('results-screen').style.display  = 'flex';
  const t2 = total*2, c = scorePP+scoreAux;
  const pct = t2>0 ? Math.round((c/t2)*100) : 0;
  document.getElementById('final-pct').textContent       = pct+'%';
  document.getElementById('final-tally').textContent     = c+' / '+t2+' points';
  document.getElementById('final-breakdown').textContent = 'participes: '+scorePP+'/'+total+'  ·  auxiliaires: '+scoreAux+'/'+total;
  const grades = [[90,'excellent'],[75,'très bien'],[60,'bien'],[40,'passable'],[0,'à revoir']];
  document.getElementById('final-grade').textContent = grades.find(([t])=>pct>=t)[1];

  const avgMs  = sessionTimes.length ? sessionTimes.reduce((a,b)=>a+b,0)/sessionTimes.length : 0;
  const cumPct = cumStats.total > 0 ? Math.round(cumStats.correct/cumStats.total*100) : 0;
  const cumAvg = cumStats.total > 0 ? (cumStats.timeSum/cumStats.total/1000).toFixed(1) : '—';
  document.getElementById('stats-session').textContent    = 'session · '+pct+'% · avg '+(avgMs/1000).toFixed(1)+'s';
  document.getElementById('stats-cumulative').textContent = 'all time · '+cumPct+'% · avg '+cumAvg+'s · '+cumStats.total+' questions';

  const ml = document.getElementById('missed-list');
  ml.innerHTML = '';
  if (missed.length) {
    const h = document.createElement('div'); h.className = 'te-missed-header';
    h.textContent = 'à revoir — '+missed.length; ml.appendChild(h);
    missed.forEach(m => {
      const r = document.createElement('div'); r.className = 'te-missed-row';
      r.innerHTML = '<span class="mi-inf">'+m.verb.inf+'</span><span class="mi-pp">'+m.verb.pp+'</span><span class="mi-ipa">'+m.verb.ipa+'</span><span class="mi-aux '+m.verb.aux+'">'+m.verb.aux+'</span>';
      ml.appendChild(r);
    });
  }
}

// ── keyboard ─────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    if (!ppDone) checkPP();
    else if (auxDone) nextQuestion();
  }
});

// ── init ─────────────────────────────────────────────────────
fetch('participes.json')
  .then(r => r.json())
  .then(data => {
    groups = data;
    const fe = document.getElementById('filters');
    groups.forEach(g => {
      const b = document.createElement('button');
      b.className = 'te-tag'; b.id = 'filter-'+g.id;
      b.textContent = g.label.replace(/groupe \d+ — /,'');
      b.onclick = () => setFilter(g.id);
      fe.appendChild(b);
    });
    ['à','â','é','è','ê','î','ï','ô','ù','û','ü','ç','œ'].forEach(ch => {
      const b = document.createElement('button');
      b.className = 'te-char'; b.textContent = ch; b.type = 'button';
      b.onclick = () => insertChar(ch);
      document.getElementById('char-bar').appendChild(b);
    });
    const dark = document.documentElement.getAttribute('data-theme') === 'dark';
    document.getElementById('theme-btn').textContent = dark ? 'light' : 'dark';
    restart();
  });

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js', {updateViaCache: 'none'});
  navigator.serviceWorker.addEventListener('controllerchange', () => window.location.reload());
}
</script>

</html>
